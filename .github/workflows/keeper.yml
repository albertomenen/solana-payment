# Bot que resuelve con Pyth, paga y reembolsa apuestas en devnet cada 5 minutos.
# GitHub solo ejecuta los workflows programados en la rama principal.
name: Keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Mismas claves que usa el despliegue (caché de Actions de la rama main).
      - name: Restaurar claves de devnet
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .keys
          key: devnet-keys-keeper-${{ github.run_id }}
          restore-keys: devnet-keys-

      - name: Comprobar claves
        run: |
          if [ ! -f .keys/deployer.json ] || [ ! -f .keys/program.json ]; then
            echo "::warning::No hay claves de devnet en la caché (aún no se ha desplegado desde main)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Ejecutar keeper
        working-directory: app
        run: |
          npm ci
          PROGRAM_ID=$(node -e "const {Keypair}=require('@solana/web3.js');console.log(Keypair.fromSecretKey(Uint8Array.from(require('../.keys/program.json'))).publicKey.toBase58())")
          NODE_PATH=$PWD/node_modules npx esbuild ../keeper/keeper.ts --bundle --platform=node --format=cjs \
            --outfile=../keeper/dist/keeper.cjs --log-level=warning \
            --define:import.meta.env="{\"VITE_PROGRAM_ID\":\"$PROGRAM_ID\"}"
          KEYPAIR_PATH=../.keys/deployer.json node ../keeper/dist/keeper.cjs
